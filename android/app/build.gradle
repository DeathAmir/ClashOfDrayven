plugins { id 'com.android.application' }

android {
    namespace 'ir.irautox.clashofdrayven'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.irautox.clashofdrayven'
        minSdk 24
        targetSdk 35
        versionCode 30001
        versionName '3.0.1'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3 -fvisibility=hidden -ffunction-sections -fdata-sections' }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    signingConfigs {
        release {
            def ks = System.getenv('DRY_KEYSTORE')
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('DRY_STORE_PASSWORD') ?: 'drayven-ci-2026'
                keyAlias System.getenv('DRY_KEY_ALIAS') ?: 'drayven'
                keyPassword System.getenv('DRY_KEY_PASSWORD') ?: 'drayven-ci-2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            ndk { debugSymbolLevel 'NONE' }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }
}
