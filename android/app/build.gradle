plugins { id 'com.android.application' }

android {
    namespace 'ir.irautox.clashofdrayven'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.irautox.clashofdrayven'
        minSdk 24
        targetSdk 35
        versionCode 62000
        versionName '6.2.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3 -fvisibility=hidden -ffunction-sections -fdata-sections' }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'NONE' }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions { jniLibs { useLegacyPackaging false } }
}
