name: Windows .NET Framework 4.8 Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch licensed assets and font
        shell: pwsh
        run: ./scripts/fetch_assets.ps1

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ClashOfDrayven.csproj
          dotnet restore Tools/ClDryPacker/ClDryPacker.csproj

      - name: Build .NET Framework 4.8
        shell: pwsh
        run: |
          dotnet build ClashOfDrayven.csproj -c Release --no-restore
          dotnet build Tools/ClDryPacker/ClDryPacker.csproj -c Release --no-restore

      - name: Package game and CLDRYPK assets
        shell: pwsh
        run: |
          $out = 'dist/ClashOfDrayven-net48'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'bin/Release/net48/*' $out -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$out/Assets" | Out-Null
          $packer = 'Tools/ClDryPacker/bin/Release/net48/cldrypk.exe'
          & $packer pack 'build-assets/ClientAssets' "$out/Assets/GameAssets.cldrypk"
          New-Item -ItemType Directory -Force -Path "$out/Tools" | Out-Null
          Copy-Item $packer "$out/Tools/cldrypk.exe" -Force
          Copy-Item 'PACK_FORMAT.md' "$out/Tools/PACK_FORMAT.md" -Force
          Copy-Item 'README.md' "$out/README.md" -Force
          Copy-Item 'THIRD_PARTY_NOTICES.md' "$out/THIRD_PARTY_NOTICES.md" -Force
          Copy-Item 'build-assets/LICENSE-developers-hub.txt' "$out/LICENSE-developers-hub.txt" -Force
          Get-ChildItem $out -Recurse -File | Sort-Object Length -Descending | Select-Object -First 15 FullName,Length | Format-Table -AutoSize

      - name: Try UPX best LZMA
        continue-on-error: true
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          $targets = @('dist/ClashOfDrayven-net48/ClashOfDrayven.exe','dist/ClashOfDrayven-net48/Tools/cldrypk.exe')
          foreach ($target in $targets) {
            if (Test-Path $target) {
              & upx --best --lzma $target
              if ($LASTEXITCODE -ne 0) { Write-Warning "UPX skipped managed binary: $target"; $global:LASTEXITCODE = 0 }
            }
          }

      - name: Create compressed downloads
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/ClashOfDrayven-net48/*' -DestinationPath 'dist/ClashOfDrayven-Windows-net48.zip' -CompressionLevel Optimal -Force
          $seven = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $seven)) { $seven = (Get-Command 7z.exe).Source }
          & $seven a -t7z -mx=9 -m0=lzma2 -md=64m -mfb=273 'dist/ClashOfDrayven-Windows-net48-ultra.7z' '.\dist\ClashOfDrayven-net48\*'
          Get-Item 'dist/ClashOfDrayven-Windows-net48.zip','dist/ClashOfDrayven-Windows-net48-ultra.7z' | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfDrayven-Windows-net48
          path: |
            dist/ClashOfDrayven-Windows-net48.zip
            dist/ClashOfDrayven-Windows-net48-ultra.7z
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: drayven-${{ github.run_number }}
          name: Clash Of Drayven Build ${{ github.run_number }} - net48
          body: |
            Clash Of Drayven Windows build migrated to .NET Framework 4.8.

            Includes the Elf logo game icon, Supercell-Magic_5 font supplied under the project owner's license, complete MIT-licensed developers-hub-org/clash-of-clans-clone Client/Assets packed losslessly into GameAssets.cldrypk, selected runtime building textures, CLDRYPK pack/unpack tool, base building, upgrades, economy, recruitable units and simple clans.

            ZIP is the convenient download. The 7z file uses Ultra LZMA2 for the smallest release size. UPX is attempted with --best --lzma when the managed PE format is supported.
          files: |
            dist/ClashOfDrayven-Windows-net48.zip
            dist/ClashOfDrayven-Windows-net48-ultra.7z
          fail_on_unmatched_files: true
